name: NODC concordance drift check

# Monthly cron per ADR 0001 section 8 / nccs-contracts ADR 0004.
# On drift, opens a GitHub issue against this repo.
on:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC, 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: R CMD INSTALL .

      - name: Run drift check
        run: |
          Rscript -e 'nccs.data.efile::drift_check_nodc(open_issue = TRUE, repo = Sys.getenv("GITHUB_REPOSITORY"))'
