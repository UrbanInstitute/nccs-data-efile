# nccs-data-efile producer configuration.
#
# Local and EC2 production modes share this file; differences are
# expressed as profile overrides, not code branches. See ADR 0001 §4.

default:
  parallelism:
    # Governs the XML *parse* step only (CPU-bound). Network staging is
    # handled separately by the ZIP-bulk path in `staging` below.
    workers: 4
    plan: multisession  # multisession | multicore

  # XML staging. The GT lake publishes per-release-year ZIP bundles at
  # EfileData/XmlZips/ whose entries are named {object_id}_public.xml -
  # the same key as the index's object_id. We download one ZIP at a time
  # (a checkpoint unit), unzip, keep only in-scope object_ids, parse, and
  # delete - far faster than ~2M per-filing GETs. Any in-scope object_id
  # absent from every ZIP is fetched individually with s5cmd (fallback).
  staging:
    mode: "zips"  # zips | objects
    zip_prefix: "s3://gt990datalake-rawdata/EfileData/XmlZips/"
    # ZIP filename year is the RELEASE year, not tax year; a tax year's
    # filings scatter across release ZIPs. Pull releases >= this floor.
    zip_release_year_floor: 2021
    stage_dir: "/mnt/stage"  # ephemeral; instance-store NVMe if available
    fallback_tool: "s5cmd"

  scope:
    forms: ["990", "990PF"]
    tax_years: [2020, 2021, 2022, 2023, 2024]
    index_filter: ~  # optional regex or explicit key list for local slices

  extract:
    # Skip pathologically large filings whose XML parses to a multi-GB
    # DOM - they peg one worker for minutes and stall the whole batch
    # (and risk OOM). Skipped filings are recorded with an _extract_error.
    # Set to 0 to disable the cap.
    max_file_mb: 50

  output:
    s3_enabled: false
    s3_prefix: "s3://nccsdata/processed/efile/"
    local_dir: "out/"
    phase: "phase0"
    vintage: ~  # auto-derived as v{YYYY.MM} at run time if null

  upstream:
    primary: "gt_data_lake"  # gt_data_lake | irs_direct
    gt_data_lake:
      index_prefix: "s3://gt990datalake-rawdata/Indices/990xmls/"
    irs_direct:
      base_url: "https://www.irs.gov/charities-non-profits/form-990-series-downloads"
      # ZIP URL pattern. Substitutions: {tax_year}, {month} (zero-padded).
      # Open item - pin once the exact URL pattern is verified.
      url_pattern: ~

  vendored:
    # Pinned SHA of NODC concordance file. See ADR 0001 §8.
    # Pinned 2026-05-22 from
    # https://github.com/Nonprofit-Open-Data-Collective/irs-efile-master-concordance-file HEAD.
    nodc_concordance_sha: "49f62af015ad56c4857273eff633166ba6c1a4da"
    nodc_concordance_s3_prefix: "s3://nccsdata/processed/efile/concordance/"
    irs_xsd_cache_s3_prefix: "s3://nccsdata/processed/efile/schemas/"

  # Phase 0 published outputs. Each entry produces one
  # {name}.parquet (plus dictionary + quality) under the vintage dir.
  # `fields` references nccs_name values in the layer-2 dictionary.
  phase0_outputs:
    - name: "government_grants"
      fields: ["government_grants"]
    - name: "program_related_investments"
      fields: ["program_related_investments_total"]

  # Parquet writer options. zstd compression per contracts/efile.yml.
  parquet:
    compression: "zstd"

  xsd:
    # IRS XSD ZIP URL pattern (TEOS schemas page, public).
    # Substitutions: {tax_year}, {version}. Version string is literal -
    # IRS uses both "5.0" (2024) and "5-0" (2022, 2023); pass as-is.
    # Source: https://www.irs.gov/charities-non-profits/tax-exempt-organization-search-teos-schemas
    # Note: the most recent / upcoming PY schemas are behind IRS e-File
    # provider login; only completed tax years are mirrored on TEOS.
    url_pattern: "https://www.irs.gov/pub/irs-tege/990x-schema-{tax_year}v{version}.zip"
    local_cache_dir: "~/.cache/nccs-data-efile/xsds"
    # Per-tax-year list of versions to fetch + verify against. Each
    # version is a separate IRS schema release. Phase 0 verification
    # iterates the cross product (tax_year x version x claim).
    versions:
      "2020": ["4.0", "4.1", "4.2"]
      "2021": ["4.0", "4.1", "4.2", "4.3"]
      "2022": ["4-0", "4-1", "5-0"]
      "2023": ["4-0", "5-0", "5-1", "6.0"]
      "2024": ["5.0", "5.1", "5.2"]
    # XSD inheritance: 2024v5.1 and 2024v5.2 schemas are not on the
    # public TEOS page (they're only on the gated MeF developer
    # portal). The GT 2024 yearly index shows ~58% of 990 filings and
    # ~70% of 990PF filings declare returnVersion=5.1 or 5.2, so we
    # can't skip them. Until we obtain those schemas (via SOI or MeF),
    # verification reuses the 2024v5.0 XSDs and records the
    # inheritance explicitly in the manifest. The empirical
    # invariance of the Phase 0 XPaths across 5.x is tested
    # separately by sampling filings; see Phase D validation log.
    version_aliases:
      "2023":
        "6.0":
          xsd_from: "5-1"
          reason: "TEOS does not publish 2023v6.0; inheriting 2023v5.1 XSDs pending SOI/MeF retrieval. Phase 0 XPaths empirically confirmed across 2023 versions (ADR 0002 Outcome, 12/12 held-out exercised 2023v6.0)."
      "2024":
        "5.1":
          xsd_from: "5.0"
          reason: "TEOS does not publish 2024v5.1; inheriting 2024v5.0 XSDs pending SOI/MeF retrieval."
        "5.2":
          xsd_from: "5.0"
          reason: "TEOS does not publish 2024v5.2; inheriting 2024v5.0 XSDs pending SOI/MeF retrieval."
    # NOTE: the former `phase0_claims` list was retired in Phase 0.5.
    # Schema verification is now driven by the dictionary's own
    # `xpath_claims` checked against the mechanical Layer 1 XSD inventory
    # (run_phase0_verification -> verify_dictionary_against_inventory),
    # so there is no separate hand-maintained claim list to keep in sync.

  verification:
    # Thresholds PINNED from the published v2026.05 vintage (manifest
    # build_timestamp 2026-05-29T21:07Z, producer SHA a9c32e5). The
    # earlier bands came from a 2026-05-22 dry-run (100 filings) whose
    # PRI estimate (0.98) was a small-sample artifact; the full vintage
    # measured PRI 0.6178 and gov_grants 0.6417 over 526,807 / 1,412,695
    # rows (source: each output's _quality.json null_rate_per_column,
    # cross-checked vs manifest.value_distribution n=5000 samples:
    # gov_grants 0.6612, PRI 0.6094). Bands below bracket the observed
    # rate with ~+/-0.10 margin for sampling noise and year-mix drift
    # (the 2024 share keeps growing and 2024 has the highest GG null
    # rate ~0.73) while still catching the catastrophic failure class -
    # e.g. the TY2022/2023 version-key bug that drove rates toward ~1.0.
    #
    # strict: enforce the configured thresholds (fail the build on
    # breach). TRUE as of v2026.06: v2026.05 measured the real
    # distribution, the bands are now pinned from it, so the gate
    # enforces. (Only the distribution gate honors this flag; XSD
    # verification is always strict - see run_phase0.R.)
    #
    # As of v2026.06 the gate evaluates min/max over the FULL
    # population, not a sample (min/max are order statistics; a sample
    # cannot bound them). The value bands below are therefore widened
    # to admit the real population tail observed in v2026.06's
    # _quality.json, while still catching the catastrophic class
    # (all-null -> null_rate ~1.0; a cents/dollars units error ->
    # values ~100x past these maxima):
    #   - GG max 5.0e10: the real GG max is $13.2B (Battelle Memorial
    #     Institute, which manages federal national labs, recurs at
    #     ~$9-12B/yr). The old 1.0e10 ceiling predated knowledge that
    #     Battelle-class mega-grantees exist in the tail.
    #   - GG/PRI min -1.0e8: negative line-1e / PRI totals are
    #     real-as-filed (they pair with a negative TotalContributionsAmt
    #     - prior-year grant clawbacks / restatements). Observed floors
    #     were GG -$5.7M, PRI -$55K; -$100M leaves headroom.
    # null_rate is a proportion, so the sample-era bands still hold;
    # they bracket the population rate (GG 0.6417, PRI 0.6178) with a
    # ~+/-0.10 margin for year-mix drift (the 2024 share keeps growing
    # and 2024 has the highest GG null rate ~0.73).
    strict: true
    # Retained for reference / downstream tooling; the distribution
    # gate no longer samples (it reads the full population).
    sample_size_per_form_year: 1000
    fields:
      government_grants:
        type: "double"
        forms_applicable: ["990"]
        min: -1.0e+8
        max: 5.0e+10
        null_rate_min: 0.55
        null_rate_max: 0.78
      program_related_investments_total:
        type: "double"
        forms_applicable: ["990PF"]
        min: -1.0e+8
        max: 1.0e+10
        null_rate_min: 0.50
        null_rate_max: 0.72

  aws:
    profile: "thiya"
    region: "us-east-1"

# Production overrides applied on EC2 c5.18xlarge.
production:
  parallelism:
    # multicore (fork) vastly outperforms multisession (PSOCK) for this
    # CPU-bound, local-file parse: parse_bench on a 72-vCPU box measured
    # ~12x speedup for multicore vs ~0.1x (i.e. 16x SLOWER than one core)
    # for multisession, whose per-task socket serialization dominates.
    # Leave 2 vCPUs for the OS + terminal responsiveness.
    workers: 70
    plan: multicore
  output:
    s3_enabled: true
